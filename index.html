<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tarjeta de Identificación</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; gap: 40px; padding: 40px; flex-wrap: wrap; }
        .form-container, .card-container { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 380px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; font-size: 20px; border-bottom: 2px solid #eaeaea; padding-bottom: 8px; }
        .row { display: flex; gap: 12px; }
        .form-group { margin-bottom: 14px; display: flex; flex-direction: column; flex: 1; }
        .form-group label { margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #555; }
        .form-group input, .form-group select { padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #007bff; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        
        /* Estilos de la Tarjeta */
        .id-card { border: 1px solid #b5b5b5; border-radius: 14px; padding: 20px; background: linear-gradient(135deg, #ffffff 0%, #f9fbfd 100%); position: relative; min-height: 220px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .card-header { font-weight: bold; font-size: 16px; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 8px; color: #007bff; text-transform: uppercase; letter-spacing: 1px; }
        .card-body { display: flex; gap: 20px; margin-top: 15px; flex: 1; }
        .card-photo { width: 105px; height: 135px; border: 2px dashed #bbb; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #f0f0f0; overflow: hidden; flex-shrink: 0; }
        .card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { font-size: 11px; color: #888; font-weight: bold; text-align: center; text-transform: uppercase; }
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-info p { margin: 3px 0; font-size: 13px; color: #333; line-height: 1.4; }
        .card-info span { font-weight: bold; color: #666; font-size: 11px; display: inline-block; width: 85px; text-transform: uppercase; }
        .card-info .value { font-weight: 600; color: #111; font-size: 13px; display: inline; }
    </style>
</head>
<body>

    <!-- Formulario de Entrada -->
    <div class="form-container">
        <h2>Datos del Ciudadano</h2>
        
        <div class="row">
            <div class="form-group">
                <label>Primer Nombre</label>
                <input type="text" id="pNombre" placeholder="Ej. Juan">
            </div>
            <div class="form-group">
                <label>Segundo Nombre</label>
                <input type="text" id="sNombre" placeholder="Ej. Carlos">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Primer Apellido</label>
                <input type="text" id="pApellido" placeholder="Ej. Pérez">
            </div>
            <div class="form-group">
                <label>Segundo Apellido</label>
                <input type="text" id="sApellido" placeholder="Ej. Gómez">
            </div>
        </div>

        <label style="font-weight: 600; font-size: 13px; color: #555; display: block; margin-bottom: 6px;">Fecha de Nacimiento</label>
        <div class="row" style="margin-bottom: 14px;">
            <div class="form-group" style="margin-bottom: 0;">
                <input type="number" id="nacDia" placeholder="Día" min="1" max="31">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <select id="nacMes">
                    <option value="">Mes</option>
                    <option value="01">Enero</option>
                    <option value="02">Febrero</option>
                    <option value="03">Marzo</option>
                    <option value="04">Abril</option>
                    <option value="05">Mayo</option>
                    <option value="06">Junio</option>
                    <option value="07">Julio</option>
                    <option value="08">Agosto</option>
                    <option value="09">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="number" id="nacAnio" placeholder="Año" min="1900" max="2026">
            </div>
        </div>

        <div class="form-group">
            <label>Número de Identificación</label>
            <input type="text" id="numIdentificacion" placeholder="Ej. 1023456789">
        </div>

        <div class="form-group">
            <label>Subir Foto desde Galería</label>
            <input type="file" id="subirFoto" accept="image/*">
        </div>

        <button onclick="actualizarIdentificacion()">Generar Tarjeta</button>
    </div>

    <!-- Resultado Visual de la Tarjeta -->
    <div class="card-container">
        <h2>Tarjeta Generada</h2>
        <div class="id-card">
            <div class="card-header">Tarjeta de Identidad</div>
            <div class="card-body">
                <div class="card-photo" id="vistaFoto">
                    <span class="photo-placeholder">Sin Foto</span>
                </div>
                <div class="card-info">
                    <p><span>Nombres:</span><span class="value" id="cardNombres">-</span></p>
                    <p><span>Apellidos:</span><span class="value" id="cardApellidos">-</span></p>
                    <p><span>Nacimiento:</span><span class="value" id="cardNacimiento">-</span></p>
                    <p><span>No. ID:</span><span class="value" id="cardID">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function actualizarIdentificacion() {
            // Obtener valores de texto
            const primerNombre = document.getElementById('pNombre').value.trim();
            const segundoNombre = document.getElementById('sNombre').value.trim();
            const primerApellido = document.getElementById('pApellido').value.trim();
            const segundoApellido = document.getElementById('sApellido').value.trim();
            
            const dia = document.getElementById('nacDia').value.trim();
            const mes = document.getElementById('nacMes').value;
            const anio = document.getElementById('nacAnio').value.trim();
            
            const identificacion = document.getElementById('numIdentificacion').value.trim();

            // Combinar los nombres y los apellidos
            const nombresCompletos = `${primerNombre} ${segundoNombre}`.trim();
            const apellidosCompletos = `${primerApellido} ${segundoApellido}`.trim();
            
            // Estructurar la fecha
            let fechaCompleta = "-";
            if(dia && mes && anio) {
                fechaCompleta = `${dia}/${mes}/${anio}`;
            }

            // Asignar los valores a la tarjeta de interfaz
            document.getElementById('cardNombres').innerText = nombresCompletos || "-";
            document.getElementById('cardApellidos').innerText = apellidosCompletos || "-";
            document.getElementById('cardNacimiento').innerText = fechaCompleta;
            document.getElementById('cardID').innerText = identificacion || "-";

            // Procesar y renderizar la foto de la galería
            const archivoInput = document.getElementById('subirFoto');
            const contenedorFoto = document.getElementById('vistaFoto');
            
            if (archivoInput.files && archivoInput.files[0]) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    contenedorFoto.innerHTML = `<img src="${e.target.result}" alt="Foto de perfil">`;
                }
                lector.readAsDataURL(archivoInput.files[0]);
            }
        }
    </script>
</body>
</html>
